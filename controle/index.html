<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de SP</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="container">
        <div class="brand-header">
          <a class="back-link" href="index.html">&larr; Voltar</a>
          <div class="eyebrow">EMR <span>|</span> Portal Pré-Operação</div>
          <div class="title">Controle de SP</div>
        </div>

        <form action="#" class="form-grid">
          <!-- Campos do Formulário -->

          <div class="field">
            <label for="regiao">Região:</label>
            <select id="regiao" name="regiao" required>
              <option value=""></option>
              <option value="ctz">CTZ</option>
              <option value="mau">MAU</option>
              <option value="mre">MRE</option>
              <option value="nvf">NVF</option>
              <option value="uba">UBA</option>
            </select>
          </div>

          <div class="field">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" required />
          </div>

          <div class="field">
            <label for="obra">Obra:</label>
            <input type="text" id="obra" name="obra" required />
          </div>

          <div class="field">
            <label for="wr">WR:</label>
            <input type="number" id="wr" name="wr" required />
          </div>

          <div class="field">
            <label for="datainc">Data de Inclusão NPCS:</label>
            <input type="date" id="datainc" name="datainc" required />
          </div>

          <div class="field">
            <label for="sp">SP:</label>
            <input type="number" id="sp" name="sp" required />
          </div>

          <div class="field">
            <label for="dataSP">Data do Desligamento:</label>
            <input type="date" id="dataSP" name="dataSP" required />
          </div>

          <div class="field">
            <label for="dataprog">Data de Programação:</label>
            <input type="date" id="dataprog" name="dataprog" required />
          </div>

          <div class="field">
            <label for="urgencia">Urgente?</label>
            <select id="urgencia" name="urgencia" required>
              <option value="não">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div class="field">
            <label for="complexo">Complexo?</label>
            <select id="complexo" name="complexo" required>
              <option value="não">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div class="field field-full">
            <label for="urg-motivo" class="escondido">Qual a Urgência?</label>
            <select
              id="urg-motivo"
              class="escondido"
              name="urg-motivo"
              required
            >
              <option value=""></option>
              <option value="solic_cliente">Solic Cliente</option>
              <option value="reclamacao_der">Reclamação DER</option>
              <option value="reclamacao_aneel">Reclamação ANEEL</option>
              <option value="reclamacao_cgov">Reclamação CGOV</option>
              <option value="solic_prefeitura">Solic Prefeitura</option>
              <option value="solic_receita_federal">
                Solic Receita Federal
              </option>
              <option value="solic_poder_publico">Solic Poder Público</option>
              <option value="obra_risco">Obra de Risco</option>
              <option value="obra_essencial_investimento">
                Obra Essencial de Investimento
              </option>
              <option value="obra_nivel_tensao">Obra de Nível de tensão</option>
              <option value="reincidencia">Reincidência</option>
              <option value="solic_cliente_at">Solic Cliente AT</option>
              <option value="transferencia_at">Transferência AT</option>
              <option value="permissao_pre_op">Permissão Pré-Op</option>
              <option value="permissao_lideres_coqe">
                Permissão Líderes COQE
              </option>
              <option value="solic_diretoria">Solic Diretoria</option>
              <option value="solic_gerencia">Solic Gerência</option>
              <option value="acordo_nqs_npcs">Acordo NQS/NPCS</option>
              <option value="decisao_juridico">Decisão Jurídico</option>
              <option value="erro_sistema">Erro Sistema</option>
              <option value="emergencial">Emergencial</option>
              <option value="contingencia">Contingência</option>
              <option value="condicoes_climaticas">Condições Climáticas</option>
            </select>
          </div>

          <div class="field field-full">
            <label for="obs">Observações:</label>
            <textarea id="obs" name="obs"></textarea>
          </div>

          <button type="submit" id="enviar" class="enviar field-full">
            Enviar
          </button>

          <!-- Campos do Formulário -->
        </form>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
